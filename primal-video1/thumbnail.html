<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#000}svg{display:block}</style>
</head><body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#06222b"/>
    <stop offset="0.55" stop-color="#0d4a52"/>
    <stop offset="1" stop-color="#e0782a"/>
  </linearGradient>
  <radialGradient id="fireglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffb347" stop-opacity="0.95"/>
    <stop offset="0.4" stop-color="#ff7a1a" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="phoneglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#bff6ff" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#5fe0f0" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#5fe0f0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0.6" stop-color="#ffd27a" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#ffb347" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff8a2a"/><stop offset="1" stop-color="#d9531a"/>
  </linearGradient>
  <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9a6a3e"/><stop offset="1" stop-color="#6b4424"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="txtshadow" x="-10%" y="-10%" width="130%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
  </filter>
</defs>

<!-- sky -->
<rect width="1280" height="720" fill="url(#sky)"/>
<g fill="#fff" opacity="0.85">
  <circle cx="80" cy="260" r="2"/><circle cx="420" cy="40" r="2.5"/><circle cx="520" cy="120" r="1.6"/>
  <circle cx="640" cy="60" r="2"/><circle cx="760" cy="30" r="1.8"/><circle cx="880" cy="90" r="2.4"/>
  <circle cx="990" cy="40" r="1.6"/><circle cx="1100" cy="110" r="2"/><circle cx="1210" cy="50" r="2.6"/>
  <circle cx="1240" cy="170" r="1.5"/><circle cx="700" cy="170" r="1.4"/><circle cx="590" cy="210" r="1.8"/>
</g>

<!-- far mountains -->
<path d="M0 470 L120 380 L230 430 L360 340 L470 420 L600 360 L720 430 L860 350 L980 410 L1100 330 L1280 420 L1280 720 L0 720Z" fill="#0a3940" opacity="0.9"/>

<!-- mammoth silhouette on ridge -->
<g transform="translate(40,345) scale(0.95)" fill="#08272c">
  <ellipse cx="90" cy="70" rx="95" ry="62"/>
  <circle cx="170" cy="40" r="42"/>
  <ellipse cx="150" cy="10" rx="30" ry="22"/>
  <rect x="20" y="100" width="30" height="70" rx="10"/>
  <rect x="70" y="105" width="30" height="65" rx="10"/>
  <rect x="120" y="100" width="30" height="70" rx="10"/>
  <path d="M195 55 Q215 120 190 160 Q185 168 178 160 Q195 115 180 70Z"/>
  <path d="M190 70 Q250 110 225 150" stroke="#f3e6c8" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M176 74 Q225 120 200 155" stroke="#e6d6b2" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="186" cy="30" r="4" fill="#ffcf6b"/>
</g>

<!-- ground -->
<path d="M0 560 Q320 520 640 545 Q960 570 1280 530 L1280 720 L0 720Z" fill="#3a2516"/>
<path d="M0 600 Q400 575 760 600 Q1040 620 1280 590 L1280 720 L0 720Z" fill="#2a190e"/>

<!-- fire glow + fire -->
<circle cx="250" cy="600" r="330" fill="url(#fireglow)"/>
<g transform="translate(250,600)">
  <path d="M-55 30 L55 30" stroke="#4a2c17" stroke-width="18" stroke-linecap="round"/>
  <path d="M-45 18 L50 40" stroke="#5a361c" stroke-width="16" stroke-linecap="round"/>
  <path d="M0 -110 C40 -60 55 -20 30 20 C15 35 -15 35 -30 20 C-55 -10 -30 -60 0 -110Z" fill="#ff7a1a"/>
  <path d="M5 -70 C28 -40 32 -10 15 15 C5 24 -12 24 -20 12 C-32 -10 -15 -40 5 -70Z" fill="#ffc84a"/>
  <path d="M3 -30 C14 -15 14 0 6 12 C0 16 -8 14 -10 6 C-13 -6 -5 -18 3 -30Z" fill="#fff3c4"/>
</g>

<!-- ===== cave people (background crowd) ===== -->
<!-- caveman 1 (left, with spear) -->
<g transform="translate(470,330)">
  <path d="M-10 -40 L-40 330" stroke="#6b4a2a" stroke-width="10" stroke-linecap="round"/>
  <path d="M-10 -40 L-22 -80 L2 -44Z" fill="#c9c2b0"/>
  <path d="M-70 120 Q0 90 70 120 L80 300 L-80 300Z" fill="url(#fur)"/>
  <g fill="#3e2714" opacity="0.6"><circle cx="-30" cy="170" r="9"/><circle cx="25" cy="200" r="8"/><circle cx="-10" cy="240" r="7"/></g>
  <circle cx="0" cy="55" r="72" fill="#111"/>
  <path d="M-75 40 Q-80 -30 -20 -25 Q0 -60 30 -25 Q85 -30 78 40 Q70 0 40 -5 Q10 10 -20 -5 Q-60 0 -75 40Z" fill="#5a3818"/>
  <ellipse cx="-2" cy="62" rx="20" ry="26" fill="#fff"/><ellipse cx="42" cy="62" rx="20" ry="26" fill="#fff"/>
  <circle cx="8" cy="70" r="9" fill="#111"/><circle cx="52" cy="70" r="9" fill="#111"/>
  <circle cx="-38" cy="105" r="10" fill="#f2c79a" opacity="0.0"/>
</g>
<!-- caveman 2 (center back, sly grin, bone necklace) -->
<g transform="translate(640,300)">
  <path d="M-75 120 Q0 92 75 120 L85 320 L-85 320Z" fill="#7a5230"/>
  <g stroke="#efe6d2" stroke-width="7" stroke-linecap="round"><path d="M-30 128 L-34 148"/><path d="M-10 132 L-11 154"/><path d="M10 132 L11 154"/><path d="M30 128 L34 148"/></g>
  <circle cx="0" cy="50" r="74" fill="#111"/>
  <path d="M-80 30 Q-70 -40 0 -35 Q75 -40 80 30 Q60 -5 0 0 Q-55 -5 -80 30Z" fill="#2e1c0c"/>
  <path d="M-38 52 Q-20 40 -2 52" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M10 52 Q28 40 46 52" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M-18 88 Q8 110 36 88" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
</g>
<!-- cavewoman 3 (right back, amazed, big hair) -->
<g transform="translate(1110,345)">
  <path d="M-70 120 Q0 92 70 120 L80 300 L-80 300Z" fill="#8c5e34"/>
  <circle cx="-90" cy="40" r="55" fill="#b5651d"/><circle cx="90" cy="40" r="55" fill="#b5651d"/>
  <circle cx="0" cy="-10" r="70" fill="#b5651d"/>
  <circle cx="0" cy="55" r="70" fill="#111"/>
  <ellipse cx="-26" cy="62" rx="19" ry="25" fill="#fff"/><ellipse cx="20" cy="62" rx="19" ry="25" fill="#fff"/>
  <circle cx="-36" cy="70" r="9" fill="#111"/><circle cx="10" cy="70" r="9" fill="#111"/>
  <ellipse cx="-4" cy="108" rx="10" ry="13" fill="#fff"/>
</g>

<!-- ===== HERO ===== -->
<g transform="translate(860,330)">
  <!-- rim light halo -->
  <circle cx="0" cy="40" r="185" fill="url(#rim)"/>
  <!-- hoodie body -->
  <path d="M-150 175 Q0 120 150 175 L175 420 L-175 420Z" fill="url(#hoodie)"/>
  <path d="M-60 160 Q0 205 60 160" stroke="#b84512" stroke-width="10" fill="none"/>
  <path d="M-22 180 L-26 250" stroke="#fff3e0" stroke-width="7" stroke-linecap="round"/>
  <path d="M22 180 L26 250" stroke="#fff3e0" stroke-width="7" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="0" cy="30" r="140" fill="#111"/>
  <circle cx="0" cy="30" r="140" fill="none" stroke="#ffb347" stroke-width="5" opacity="0.6"/>
  <!-- worried brows -->
  <path d="M-95 -38 Q-60 -60 -25 -48" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M25 -48 Q60 -60 95 -38" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- eyes, pupils looking down at phone -->
  <ellipse cx="-52" cy="30" rx="40" ry="54" fill="#fff"/>
  <ellipse cx="52" cy="30" rx="40" ry="54" fill="#fff"/>
  <circle cx="-44" cy="56" r="17" fill="#111"/><circle cx="44" cy="56" r="17" fill="#111"/>
  <!-- sweat drop -->
  <path d="M118 -30 C138 0 142 20 128 32 C116 42 98 34 100 16 C102 0 112 -14 118 -30Z" fill="#59d0ff"/>
  <path d="M116 0 C120 10 120 18 114 22" stroke="#e8fbff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- arms + phone -->
  <path d="M-130 290 Q-80 270 -34 282" stroke="#e9661f" stroke-width="58" fill="none" stroke-linecap="round"/>
  <path d="M130 290 Q80 266 30 276" stroke="#e9661f" stroke-width="58" fill="none" stroke-linecap="round"/>
  <circle cx="0" cy="210" r="120" fill="url(#phoneglow)"/>
  <g transform="translate(0,205) rotate(-8)">
    <rect x="-46" y="-80" width="92" height="160" rx="16" fill="#1b1b1f"/>
    <rect x="-38" y="-70" width="76" height="140" rx="10" fill="#9ef0ff"/>
    <rect x="-28" y="-28" width="56" height="20" rx="4" fill="#0d4a52"/>
    <text x="0" y="-13" text-anchor="middle" font-family="Titan One, sans-serif" font-size="12" fill="#fff">NO SIGNAL</text>
    <rect x="-28" y="2" width="38" height="12" rx="3" fill="#ff5a3c"/>
    <text x="16" y="13" font-family="Titan One, sans-serif" font-size="11" fill="#0d4a52">2%</text>
  </g>
  <circle cx="-34" cy="282" r="22" fill="#111"/><circle cx="30" cy="276" r="22" fill="#111"/>
</g>

<!-- ===== TEXT ===== -->
<g filter="url(#txtshadow)" font-family="Titan One, sans-serif">
  <text x="60" y="190" font-size="190" fill="#fff8ec" stroke="#06222b" stroke-width="14" paint-order="stroke" letter-spacing="4">DAY</text>
  <text x="470" y="190" font-size="210" fill="#ff8a2a" stroke="#06222b" stroke-width="14" paint-order="stroke">1</text>
</g>
<!-- year chip -->
<g transform="translate(70,230)">
  <rect width="300" height="64" rx="32" fill="#06222b" opacity="0.85"/>
  <rect width="300" height="64" rx="32" fill="none" stroke="#ff8a2a" stroke-width="4"/>
  <text x="150" y="44" text-anchor="middle" font-family="Titan One, sans-serif" font-size="36" fill="#fff8ec">50,000 BC</text>
</g>
</svg>
</body></html>
