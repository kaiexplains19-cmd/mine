<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b3366"/><stop offset="1" stop-color="#5a4a86"/>
  </linearGradient>
  <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2c2550"/><stop offset="1" stop-color="#4a3f78"/>
  </linearGradient>
  <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#2f2752"/><stop offset="1" stop-color="#54468a"/>
  </linearGradient>
  <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffd08a" stop-opacity="0.85"/>
    <stop offset="0.35" stop-color="#f2a65a" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#f2a65a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="caveglow" cx="0.5" cy="0.6" r="0.6">
    <stop offset="0" stop-color="#ffcf7a"/><stop offset="0.5" stop-color="#e9883a"/><stop offset="1" stop-color="#7a3d2a"/>
  </radialGradient>
  <radialGradient id="torch" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff2c8" stop-opacity="1"/>
    <stop offset="0.3" stop-color="#ffc066" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#ffb04a" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="2.5"/></filter>
  <filter id="shadowT" x="-10%" y="-10%" width="130%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a1238" flood-opacity="0.45"/>
  </filter>
  <filter id="sparkle"><feGaussianBlur stdDeviation="1"/></filter>
</defs>

<!-- base -->
<rect width="1280" height="720" fill="#2a2350"/>

<!-- left canyon wall (perspective) -->
<path d="M0 0 L470 0 L300 720 L0 720Z" fill="url(#wallL)"/>
<g fill="#3a3168">
  <path d="M0 80 L440 60 L430 110 L0 150Z"/>
  <path d="M0 300 L380 270 L360 330 L0 380Z"/>
  <path d="M0 520 L330 490 L315 560 L0 600Z"/>
</g>
<!-- ledge top highlights -->
<path d="M470 0 L300 720" stroke="#7c6bb8" stroke-width="6" opacity="0.6"/>

<!-- right canyon wall -->
<path d="M800 0 L1280 0 L1280 720 L1020 720Z" fill="url(#wallR)"/>
<path d="M800 0 L1020 720" stroke="#8a78c4" stroke-width="6" opacity="0.55"/>

<!-- path / valley floor -->
<path d="M470 0 L800 0 L1020 720 L300 720Z" fill="url(#path)"/>
<!-- path stones (like paving) -->
<g fill="#4a3f7a" opacity="0.8">
  <ellipse cx="560" cy="60" rx="26" ry="8"/><ellipse cx="720" cy="110" rx="30" ry="9"/>
  <ellipse cx="520" cy="200" rx="34" ry="10"/><ellipse cx="760" cy="250" rx="30" ry="10"/>
  <ellipse cx="470" cy="420" rx="44" ry="13"/><ellipse cx="840" cy="470" rx="40" ry="13"/>
  <ellipse cx="420" cy="640" rx="56" ry="16"/><ellipse cx="900" cy="660" rx="50" ry="15"/>
</g>

<!-- small rocks along path edge (bollard rhythm) -->
<g fill="#1f1940">
  <ellipse cx="455" cy="120" rx="10" ry="16"/><ellipse cx="420" cy="280" rx="12" ry="19"/><ellipse cx="380" cy="460" rx="14" ry="22"/>
  <ellipse cx="830" cy="110" rx="10" ry="16"/><ellipse cx="880" cy="270" rx="12" ry="19"/><ellipse cx="940" cy="440" rx="14" ry="22"/>
</g>

<!-- ferns on left ledges (planters) -->
<g fill="#3f7a4a">
  <path d="M40 300 q20 -50 40 0 q20 -55 40 0 q20 -50 40 0Z"/>
  <path d="M60 520 q24 -60 48 0 q24 -64 48 0 q24 -58 48 0Z"/>
  <path d="M300 80 q14 -36 28 0 q14 -40 28 0Z"/>
</g>
<g fill="#5e9c5f">
  <path d="M55 300 q14 -34 28 0 q14 -36 28 0Z"/><path d="M80 520 q16 -42 32 0 q16 -44 32 0Z"/>
</g>

<!-- ===== right side: glowing cave entrance (replaces café) ===== -->
<g>
  <path d="M1040 120 Q1110 20 1200 80 Q1270 130 1280 200 L1280 520 Q1180 560 1090 500 Q1040 380 1040 120Z" fill="#241d44"/>
  <path d="M1065 170 Q1120 90 1190 130 Q1250 170 1260 240 L1260 480 Q1180 510 1110 470 Q1070 370 1065 170Z" fill="url(#caveglow)"/>
  <!-- hanging hides like an awning -->
  <path d="M1030 120 Q1120 60 1280 120 L1280 175 Q1250 190 1230 170 Q1205 195 1180 168 Q1155 192 1130 165 Q1105 188 1080 160 Q1055 180 1030 155Z" fill="#c27a45"/>
  <g stroke="#8f5228" stroke-width="5"><path d="M1080 112 L1080 160"/><path d="M1130 100 L1130 165"/><path d="M1180 100 L1180 168"/><path d="M1230 108 L1230 170"/></g>
  <!-- silhouettes inside the cave -->
  <g fill="#3a1d14" opacity="0.75">
    <circle cx="1150" cy="330" r="22"/><rect x="1132" y="350" width="36" height="60" rx="14"/>
    <circle cx="1210" cy="345" r="18"/><rect x="1195" y="362" width="30" height="50" rx="12"/>
  </g>
  <!-- log seats + stone table (café furniture) -->
  <ellipse cx="1060" cy="470" rx="55" ry="18" fill="#7a5b8e"/>
  <rect x="1040" y="470" width="40" height="40" fill="#5c4470"/>
  <path d="M1030 455 Q1060 440 1090 455" stroke="#a88bbf" stroke-width="4" fill="none"/>
  <!-- clay bowl like the coffee cup -->
  <path d="M1045 458 Q1060 475 1075 458Z" fill="#d49a6a"/>
  <rect x="980" y="500" width="60" height="22" rx="10" fill="#6b4a2a"/>
  <rect x="1090" y="520" width="70" height="24" rx="11" fill="#6b4a2a"/>
  <!-- painted handprints on wall -->
  <g fill="#e0663a" opacity="0.8"><circle cx="1240" cy="560" r="12"/><circle cx="1215" cy="600" r="10"/></g>
  <!-- fern pot -->
  <path d="M1170 430 q18 -50 36 0 q18 -54 36 0 q18 -48 36 0Z" fill="#4f8f58" opacity="0.0"/>
</g>

<!-- warm pool of light under characters -->
<ellipse cx="640" cy="470" rx="360" ry="230" fill="url(#pool)"/>

<circle cx="650" cy="440" r="170" fill="url(#torch)" opacity="0.35"/>

<!-- sparkles / embers -->
<g fill="#ffe2a0" filter="url(#sparkle)">
  <circle cx="560" cy="430" r="2.5"/><circle cx="720" cy="300" r="2"/><circle cx="610" cy="560" r="2"/>
  <circle cx="790" cy="420" r="2.5"/><circle cx="500" cy="520" r="1.8"/><circle cx="700" cy="610" r="2"/>
  <circle cx="680" cy="280" r="1.6"/><circle cx="830" cy="560" r="1.8"/>
</g>

<!-- ===== characters (seen from above, small, long shadows down-left) ===== -->
<!-- shadows -->
<g fill="#1b1436" opacity="0.55">
  <path d="M590 585 L470 720 L540 720 L615 590Z"/>
  <path d="M700 580 L610 720 L670 720 L722 585Z"/>
</g>

<!-- YOU: hoodie guy -->
<g transform="translate(600,430)">
  <rect x="-14" y="110" width="11" height="48" rx="5" fill="#111"/>
  <rect x="5" y="110" width="11" height="48" rx="5" fill="#111"/>
  <ellipse cx="-9" cy="160" rx="11" ry="6" fill="#111"/><ellipse cx="11" cy="160" rx="11" ry="6" fill="#111"/>
  <path d="M-40 40 Q0 25 40 40 L44 118 L-44 118Z" fill="#f07a2a"/>
  <path d="M-16 44 Q0 58 16 44" stroke="#c45a18" stroke-width="4" fill="none"/>
  <path d="M-8 52 L-9 74" stroke="#fff0dc" stroke-width="3"/><path d="M8 52 L9 74" stroke="#fff0dc" stroke-width="3"/>
  <rect x="-54" y="44" width="14" height="60" rx="7" fill="#e06a20"/>
  <rect x="40" y="44" width="14" height="60" rx="7" fill="#e06a20"/>
  <circle cx="-47" cy="108" r="8" fill="#111"/><circle cx="47" cy="108" r="8" fill="#111"/>
  <!-- phone in hand -->
  <rect x="40" y="96" width="14" height="22" rx="3" fill="#1b1b1f"/><rect x="42" y="98" width="10" height="17" rx="2" fill="#9ef0ff"/>
  <circle cx="0" cy="0" r="44" fill="#111"/>
  <path d="M-44 -6 A44 44 0 0 1 0 -44" stroke="#ffc678" stroke-width="3" fill="none" opacity="0.7"/>
  <!-- worried face, looking up -->
  <path d="M-24 -18 Q-15 -24 -6 -20" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M6 -20 Q15 -24 24 -18" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="-14" cy="-2" rx="10" ry="12" fill="#fff"/><ellipse cx="14" cy="-2" rx="10" ry="12" fill="#fff"/>
  <circle cx="-13" cy="-5" r="4" fill="#111"/><circle cx="15" cy="-5" r="4" fill="#111"/>
  <path d="M-6 20 Q0 17 6 20" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</g>

<!-- TIK: cave kid with fur tunic and wild hair -->
<g transform="translate(712,440)">
  <rect x="-12" y="96" width="10" height="44" rx="5" fill="#111"/>
  <rect x="4" y="96" width="10" height="44" rx="5" fill="#111"/>
  <ellipse cx="-7" cy="142" rx="10" ry="5" fill="#5a3a20"/><ellipse cx="9" cy="142" rx="10" ry="5" fill="#5a3a20"/>
  <path d="M-34 36 Q0 24 34 36 L40 104 L-40 104Z" fill="#b98352"/>
  <path d="M-40 104 L-30 92 L-20 104 L-10 92 L0 104 L10 92 L20 104 L30 92 L40 104Z" fill="#b98352"/>
  <g fill="#7d5330"><circle cx="-14" cy="62" r="5"/><circle cx="12" cy="78" r="4"/><circle cx="-2" cy="90" r="4"/></g>
  <path d="M-34 36 L34 60" stroke="#e8dcc0" stroke-width="5" opacity="0.6"/>
  <rect x="-46" y="42" width="12" height="50" rx="6" fill="#111"/><rect x="34" y="42" width="12" height="50" rx="6" fill="#111"/>
  <!-- spear -->
  <path d="M46 -10 L40 140" stroke="#6b4a2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M46 -10 L40 -34 L52 -12Z" fill="#cfc6b4"/>
  <!-- wild hair -->
  <circle cx="-30" cy="-22" r="18" fill="#6b3f1a"/><circle cx="0" cy="-36" r="20" fill="#6b3f1a"/><circle cx="30" cy="-22" r="18" fill="#6b3f1a"/>
  <circle cx="0" cy="0" r="38" fill="#111"/>
  <path d="M-38 4 Q-30 -30 0 -36 Q30 -30 38 4 Q26 -16 0 -18 Q-24 -16 -38 4Z" fill="#6b3f1a"/>
  <!-- worried face -->
  <path d="M-20 -6 Q-12 -12 -4 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M4 -8 Q12 -12 20 -6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="-11" cy="8" rx="9" ry="11" fill="#fff"/><ellipse cx="12" cy="8" rx="9" ry="11" fill="#fff"/>
  <circle cx="-13" cy="6" r="4" fill="#111"/><circle cx="10" cy="6" r="4" fill="#111"/>
  <path d="M-5 26 Q0 23 5 26" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</g>

<!-- ===== foreground: blurred boulder bottom-left (like the blurred building) ===== -->
<g filter="url(#blur)">
  <path d="M-40 420 Q60 360 170 400 Q240 430 260 520 L280 760 L-40 760Z" fill="#3c3256"/>
  <path d="M-40 420 Q60 360 170 400 Q240 430 260 520" stroke="#b07a4e" stroke-width="16" fill="none" opacity="0.7"/>
  <path d="M40 560 L200 540 L220 760 L40 760Z" fill="#a8573a" opacity="0.6"/>
</g>

<!-- ===== foreground right: wooden torch on a pole (like the street lamp) ===== -->
<g>
  <path d="M1110 760 L1080 470" stroke="#3a2416" stroke-width="22" stroke-linecap="round"/>
  <path d="M1080 470 Q1060 430 1010 432" stroke="#3a2416" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- torch head hanging -->
  <path d="M985 432 L1035 432 L1028 470 L992 470Z" fill="#5a3a22"/>
  <g stroke="#3a2416" stroke-width="3"><path d="M990 445 L1032 445"/><path d="M992 458 L1030 458"/></g>
  <circle cx="1010" cy="500" r="120" fill="url(#torch)"/>
  <path d="M1010 528 C1030 506 1032 488 1020 472 L1000 472 C990 490 992 508 1010 528Z" fill="#ffb347"/>
  <path d="M1010 520 C1020 506 1020 494 1014 482 L1006 482 C1000 494 1001 506 1010 520Z" fill="#fff1c0"/>
</g>
<!-- fern bottom-right corner -->
<g fill="#3e7a4c" filter="url(#blur2)"><path d="M1180 720 q30 -90 60 0 q30 -100 60 0Z"/></g>

<!-- ===== TEXT ===== -->
<g font-family="Fredoka, sans-serif" font-weight="700" filter="url(#shadowT)">
  <text x="215" y="150" font-size="124" fill="#fbf3e4" letter-spacing="1">STUCK IN</text>
  <text x="232" y="268" font-size="124" letter-spacing="1"><tspan fill="#f6b73c">50,000</tspan><tspan fill="#fbf3e4"> BC</tspan></text>
</g>
</svg>
</body></html>
